<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7b4ac7">
  <title>Звёздный подарок для тебя</title>
  <style>
    :root {
      color-scheme: dark;
      --lavender: #d8b8ff;
      --pink: #ff91c8;
      --ink: #fff8ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--ink);
      font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 50% 40%, #a76be1 0%, #7144b2 45%, #39235f 100%);
    }

    body::before,
    body::after {
      position: fixed;
      inset: -30%;
      z-index: -1;
      content: "";
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 14% 22%, #fff 45%, transparent 55%),
        radial-gradient(2px 2px at 83% 28%, #ffe8a8 45%, transparent 55%),
        radial-gradient(1.5px 1.5px at 69% 76%, #fff 45%, transparent 55%),
        radial-gradient(2px 2px at 30% 82%, #ffd9f0 45%, transparent 55%),
        radial-gradient(1px 1px at 52% 12%, #fff 45%, transparent 55%);
      background-size: 290px 260px;
      animation: sky-drift 28s linear infinite;
      opacity: .72;
    }

    body::after {
      background-size: 410px 360px;
      animation-direction: reverse;
      animation-duration: 42s;
      opacity: .4;
    }

    .gift {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      text-align: center;
      animation: arrive .9s cubic-bezier(.2, .8, .25, 1) both;
    }

    .starfield {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      perspective: 700px;
    }

    .fly-star {
      position: absolute;
      top: -15vh;
      left: 110vw;
      width: var(--star-size, 54px);
      overflow: visible;
      opacity: .58;
      filter: drop-shadow(0 0 12px var(--star-glow, #ffd7ff));
      animation: star-cross var(--star-speed, 15s) linear var(--star-delay, 0s) infinite;
      will-change: transform;
    }

    .fly-star .shape {
      fill: var(--star-color, #bb73e6);
      stroke: #fff3ff;
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .fly-star .face { fill: #452250; }
    .fly-star .smile { fill: none; stroke: #452250; stroke-width: 2.5; stroke-linecap: round; }
    .fly-star:nth-child(2) { --star-size: 42px; --star-speed: 13s; --star-delay: -9s; --star-color: #ffd86a; --star-glow: #ffeb9e; top: 14vh; }
    .fly-star:nth-child(3) { --star-size: 66px; --star-speed: 19s; --star-delay: -3s; --star-color: #ef79bb; --star-glow: #ffb5e2; top: 28vh; }
    .fly-star:nth-child(4) { --star-size: 34px; --star-speed: 12s; --star-delay: -7s; --star-color: #63d9e8; --star-glow: #a9f4ff; top: 48vh; }
    .fly-star:nth-child(5) { --star-size: 52px; --star-speed: 17s; --star-delay: -12s; --star-color: #a887f3; --star-glow: #d3c2ff; top: 66vh; }
    .fly-star:nth-child(6) { --star-size: 38px; --star-speed: 14s; --star-delay: -5s; --star-color: #ff9a64; --star-glow: #ffd0a6; top: 82vh; }
    .fly-star:nth-child(7) { --star-size: 58px; --star-speed: 20s; --star-delay: -15s; --star-color: #7fe0be; --star-glow: #b5ffe4; top: 100vh; }

    .eyebrow {
      margin: 0 0 8px;
      color: #f5dfff;
      font-size: .83rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.3rem);
      line-height: 1.05;
      text-shadow: 0 4px 24px #4b257b99;
    }

    .subtitle {
      margin: 12px 0 0;
      color: #f6eaff;
      font-size: 1.05rem;
    }

    .sky {
      position: relative;
      width: min(80vw, 310px);
      aspect-ratio: 1;
      margin: 2px auto -2px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .halo {
      position: absolute;
      width: 76%;
      aspect-ratio: 1;
      border: 1px solid #ffffff38;
      border-radius: 50%;
      box-shadow: 0 0 70px 20px #ffc5f33b, inset 0 0 40px #fce4ff14;
      animation: halo-pulse 3s ease-in-out infinite;
    }

    .star {
      position: relative;
      z-index: 1;
      width: 82%;
      overflow: visible;
      filter: drop-shadow(0 18px 20px #35105270);
      transform-origin: 50% 50%;
      animation: star-float 3.8s ease-in-out infinite;
    }

    .star .body {
      stroke: #d82d95;
      stroke-width: 5;
      stroke-linejoin: round;
      paint-order: stroke;
    }

    .star .eye { fill: #27132f; }
    .star .shine { fill: #fff; }

    .sparkle {
      position: absolute;
      color: #fff2ab;
      font-size: 1.45rem;
      text-shadow: 0 0 16px #fff2ab;
      animation: twinkle 1.8s ease-in-out infinite alternate;
    }

    .sparkle.one { top: 13%; left: 12%; }
    .sparkle.two { top: 21%; right: 10%; animation-delay: .7s; font-size: 1rem; }
    .sparkle.three { bottom: 14%; left: 14%; animation-delay: 1.1s; font-size: .85rem; }
    .sparkle.four { right: 13%; bottom: 17%; animation-delay: .3s; }

    .heart {
      position: absolute;
      z-index: 2;
      bottom: 24%;
      left: 50%;
      color: #ffb5d9;
      font-size: var(--size, 22px);
      opacity: 0;
      pointer-events: none;
      animation: heart-rise var(--duration, 3.6s) ease-out var(--delay, 0s) infinite;
      filter: drop-shadow(0 0 8px #ff9bd5b0);
    }

    .heart:nth-of-type(1) { --size: 20px; --dx: -105px; --delay: .2s; --duration: 3.5s; }
    .heart:nth-of-type(2) { --size: 27px; --dx: 94px; --delay: 1.4s; --duration: 4s; }
    .heart:nth-of-type(3) { --size: 15px; --dx: -62px; --delay: 2.3s; --duration: 3.2s; }
    .heart:nth-of-type(4) { --size: 19px; --dx: 64px; --delay: 2.8s; --duration: 3.8s; }

    .button {
      position: relative;
      border: 0;
      border-radius: 999px;
      padding: 15px 27px;
      color: #54224f;
      background: linear-gradient(135deg, #fff1a8, #ffc4df 62%, #eecaff);
      box-shadow: 0 8px 28px #34124d66, inset 0 2px 0 #fff9;
      font: inherit;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 32px #34124d80, inset 0 2px 0 #fff9; }
    .button:active { transform: translateY(1px) scale(.99); }
    .button:focus-visible { outline: 3px solid white; outline-offset: 5px; }

    .message {
      max-height: 0;
      margin: 0 auto;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      transition: max-height .7s ease, opacity .5s ease, transform .5s ease, margin .5s ease;
    }

    .message.open {
      max-height: 180px;
      margin: 22px auto 0;
      opacity: 1;
      transform: translateY(0);
    }

    .note {
      display: inline-block;
      max-width: 440px;
      border: 1px solid #ffffff42;
      border-radius: 22px;
      padding: 17px 22px;
      background: #fff1ff20;
      box-shadow: 0 10px 35px #31164b36;
      backdrop-filter: blur(8px);
      color: white;
      line-height: 1.6;
    }

    .note strong { color: #ffe3a1; }

    .footer {
      margin: 24px 0 0;
      color: #e8d2f6c9;
      font-size: .83rem;
    }

    .burst {
      position: fixed;
      z-index: 5;
      left: var(--x);
      top: var(--y);
      color: var(--color);
      font-size: var(--size);
      pointer-events: none;
      animation: burst 1.1s ease-out forwards;
    }

    @keyframes star-float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-13px) rotate(3deg); }
    }

    @keyframes halo-pulse {
      0%, 100% { transform: scale(.94); opacity: .55; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    @keyframes heart-rise {
      0% { transform: translate(-50%, 0) scale(.55) rotate(-12deg); opacity: 0; }
      18% { opacity: .9; }
      75% { opacity: .75; }
      100% { transform: translate(calc(-50% + var(--dx)), -210px) scale(1.2) rotate(15deg); opacity: 0; }
    }

    @keyframes twinkle {
      from { transform: scale(.65) rotate(-12deg); opacity: .45; }
      to { transform: scale(1.2) rotate(12deg); opacity: 1; }
    }

    @keyframes sky-drift {
      to { transform: translate3d(60px, -40px, 0); }
    }

    @keyframes star-cross {
      0% { transform: translate3d(0, -15vh, 0) rotate(0deg) scale(.7); }
      20% { transform: translate3d(-25vw, 12vh, 0) rotate(80deg) scale(1); }
      50% { transform: translate3d(-65vw, 48vh, 0) rotate(210deg) scale(.85); }
      80% { transform: translate3d(-105vw, 84vh, 0) rotate(330deg) scale(1.05); }
      100% { transform: translate3d(-135vw, 115vh, 0) rotate(430deg) scale(.65); }
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes burst {
      from { transform: translate(-50%, -50%) scale(.4) rotate(0); opacity: 1; }
      to { transform: translate(calc(-50% + var(--x-drift)), calc(-50% + var(--y-drift))) scale(1.35) rotate(25deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="starfield" aria-hidden="true">
    <svg class="fly-star" viewBox="0 0 100 100"><path class="shape" d="M50 5 Q57 5 62 25 Q66 31 88 29 Q98 31 88 42 Q78 52 88 66 Q93 78 78 76 Q61 72 55 88 Q50 98 44 87 Q37 70 21 77 Q7 81 12 66 Q20 51 8 42 Q0 33 13 29 Q34 27 39 21 Q44 6 50 5Z"/><circle class="face" cx="39" cy="47" r="3.5"/><circle class="face" cx="61" cy="47" r="3.5"/><path class="smile" d="M43 57 Q50 65 57 57"/></svg>
    <svg class="fly-star" viewBox="0 0 100 100"><path class="shape" d="M50 5 Q57 5 62 25 Q66 31 88 29 Q98 31 88 42 Q78 52 88 66 Q93 78 78 76 Q61 72 55 88 Q50 98 44 87 Q37 70 21 77 Q7 81 12 66 Q20 51 8 42 Q0 33 13 29 Q34 27 39 21 Q44 6 50 5Z"/><circle class="face" cx="39" cy="47" r="3.5"/><circle class="face" cx="61" cy="47" r="3.5"/><path class="smile" d="M43 57 Q50 65 57 57"/></svg>
    <svg class="fly-star" viewBox="0 0 100 100"><path class="shape" d="M50 5 Q57 5 62 25 Q66 31 88 29 Q98 31 88 42 Q78 52 88 66 Q93 78 78 76 Q61 72 55 88 Q50 98 44 87 Q37 70 21 77 Q7 81 12 66 Q20 51 8 42 Q0 33 13 29 Q34 27 39 21 Q44 6 50 5Z"/><circle class="face" cx="39" cy="47" r="3.5"/><circle class="face" cx="61" cy="47" r="3.5"/><path class="smile" d="M43 57 Q50 65 57 57"/></svg>
    <svg class="fly-star" viewBox="0 0 100 100"><path class="shape" d="M50 5 Q57 5 62 25 Q66 31 88 29 Q98 31 88 42 Q78 52 88 66 Q93 78 78 76 Q61 72 55 88 Q50 98 44 87 Q37 70 21 77 Q7 81 12 66 Q20 51 8 42 Q0 33 13 29 Q34 27 39 21 Q44 6 50 5Z"/><circle class="face" cx="39" cy="47" r="3.5"/><circle class="face" cx="61" cy="47" r="3.5"/><path class="smile" d="M43 57 Q50 65 57 57"/></svg>
    <svg class="fly-star" viewBox="0 0 100 100"><path class="shape" d="M50 5 Q57 5 62 25 Q66 31 88 29 Q98 31 88 42 Q78 52 88 66 Q93 78 78 76 Q61 72 55 88 Q50 98 44 87 Q37 70 21 77 Q7 81 12 66 Q20 51 8 42 Q0 33 13 29 Q34 27 39 21 Q44 6 50 5Z"/><circle class="face" cx="39" cy="47" r="3.5"/><circle class="face" cx="61" cy="47" r="3.5"/><path class="smile" d="M43 57 Q50 65 57 57"/></svg>
    <svg class="fly-star" viewBox="0 0 100 100"><path class="shape" d="M50 5 Q57 5 62 25 Q66 31 88 29 Q98 31 88 42 Q78 52 88 66 Q93 78 78 76 Q61 72 55 88 Q50 98 44 87 Q37 70 21 77 Q7 81 12 66 Q20 51 8 42 Q0 33 13 29 Q34 27 39 21 Q44 6 50 5Z"/><circle class="face" cx="39" cy="47" r="3.5"/><circle class="face" cx="61" cy="47" r="3.5"/><path class="smile" d="M43 57 Q50 65 57 57"/></svg>
  </div>
  <main class="gift">
    <p class="eyebrow">маленькое чудо для тебя</p>
    <h1>Ты — моё солнышко ✨</h1>
    <p class="subtitle">Даже звёзды сегодня светят только для тебя</p>

    <div class="sky" aria-label="Весёлая звёздочка парит и посылает сердечки">
      <div class="halo"></div>
      <span class="sparkle one" aria-hidden="true">✦</span>
      <span class="sparkle two" aria-hidden="true">✧</span>
      <span class="sparkle three" aria-hidden="true">✦</span>
      <span class="sparkle four" aria-hidden="true">✧</span>
      <span class="heart" aria-hidden="true">♥</span>
      <span class="heart" aria-hidden="true">♥</span>
      <span class="heart" aria-hidden="true">♥</span>
      <span class="heart" aria-hidden="true">♥</span>
      <svg class="star" viewBox="0 0 240 240" role="img" aria-label="Звезда с улыбкой">
        <defs>
          <linearGradient id="starPaint" x1="18%" y1="9%" x2="85%" y2="92%">
            <stop offset="0" stop-color="#ff87c8"/>
            <stop offset=".42" stop-color="#ffca63"/>
            <stop offset=".72" stop-color="#ff8c65"/>
            <stop offset="1" stop-color="#55dfe7"/>
          </linearGradient>
          <radialGradient id="starGlow">
            <stop offset="0" stop-color="#fff6aa" stop-opacity=".95"/>
            <stop offset="1" stop-color="#fff6aa" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path class="body" fill="url(#starPaint)" d="M119 18 C136 18 145 39 153 54 C169 52 191 51 204 64 C219 80 209 101 202 116 C214 131 224 151 215 168 C206 187 184 185 165 183 C153 201 139 219 121 218 C101 217 91 197 82 181 C62 186 39 190 27 175 C13 159 25 139 34 123 C20 107 8 87 18 70 C28 52 50 55 69 58 C81 40 99 18 119 18 Z"/>
        <ellipse cx="89" cy="112" rx="45" ry="47" fill="url(#starGlow)"/>
        <ellipse cx="166" cy="96" rx="24" ry="24" fill="#fff1a5" opacity=".28"/>
        <ellipse class="eye" cx="94" cy="112" rx="5" ry="9"/>
        <ellipse class="eye" cx="143" cy="112" rx="5" ry="9"/>
        <circle class="shine" cx="95" cy="109" r="2"/>
        <circle class="shine" cx="144" cy="109" r="2"/>
        <path d="M111 126 Q119 136 128 126" fill="none" stroke="#54243e" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="76" cy="128" rx="11" ry="6" fill="#ff6598" opacity=".55"/>
        <ellipse cx="159" cy="128" rx="11" ry="6" fill="#ff6598" opacity=".55"/>
        <path d="M51 83 Q57 78 64 82 M173 151 Q182 145 186 137" fill="none" stroke="#e54b78" stroke-width="4" stroke-linecap="round"/>
        <path d="M113 42 Q122 38 129 45" fill="none" stroke="#fff4bf" stroke-width="4" stroke-linecap="round" opacity=".9"/>
      </svg>
    </div>

    <button class="button" id="openGift" type="button" aria-expanded="false" aria-controls="loveNote">
      Открыть маленький подарок 💝
    </button>
    <section class="message" id="loveNote" aria-live="polite">
      <div class="note">
        <strong>Для самой чудесной девушки 💖</strong><br>
        Пусть каждый твой день будет ярким, тёплым и волшебным. Ты делаешь мой мир красивее — просто будь собой. Обнимаю крепко!
      </div>
    </section>
    <p class="footer">Отправляю тебе целую галактику любви 💫</p>
  </main>

  <script>
    const button = document.querySelector("#openGift");
    const note = document.querySelector("#loveNote");

    button.addEventListener("click", () => {
      const isOpen = note.classList.toggle("open");
      button.setAttribute("aria-expanded", String(isOpen));
      button.textContent = isOpen ? "Ещё раз обнять звёздочку? 💗" : "Открыть маленький подарок 💝";

      if (isOpen) {
        const symbols = ["♥", "♡", "✦", "💖", "♥", "✨", "♡", "💗"];
        for (let index = 0; index < 24; index += 1) {
          const particle = document.createElement("span");
          particle.className = "burst";
          particle.textContent = symbols[index % symbols.length];
          particle.style.setProperty("--x", `${window.innerWidth / 2 + (Math.random() - .5) * 130}px`);
          particle.style.setProperty("--y", `${window.innerHeight * .48 + (Math.random() - .5) * 70}px`);
          particle.style.setProperty("--x-drift", `${(Math.random() - .5) * 240}px`);
          particle.style.setProperty("--y-drift", `${-70 - Math.random() * 170}px`);
          particle.style.setProperty("--size", `${14 + Math.random() * 18}px`);
          particle.style.setProperty("--color", ["#ffb6d9", "#fff0a8", "#f7e4ff"][index % 3]);
          document.body.append(particle);
          particle.addEventListener("animationend", () => particle.remove(), { once: true });
        }
      }
    });
  </script>
</body>
</html>
